basePath: /
definitions:
  Account:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      created_at:
        type: string
      default_cost_basis:
        type: string
      id:
        type: string
      owners:
        items:
          $ref: '#/definitions/User'
        type: array
      tax_type:
        type: string
      transactions:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      updated_at:
        type: string
    type: object
  CreateAccountRequest:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      default_cost_basis:
        type: string
      owner_ids:
        items:
          type: string
        type: array
      tax_type:
        type: string
    required:
    - account_name
    - account_type
    type: object
  CreateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
    required:
    - asset_type
    - description
    type: object
  CreateTaxLotRequest:
    properties:
      account_id:
        type: string
      commission:
        type: number
      fees:
        type: number
      holding_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
    required:
    - purchase_date
    - purchase_price
    - purchase_quantity
    type: object
  CreateTransactionRequest:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      date:
        type: string
      fees:
        type: number
      holding_id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
    required:
    - action
    - date
    type: object
  CreateUserRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    required:
    - first_name
    - last_name
    type: object
  Holding:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      created_at:
        type: string
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      gain_realized_amount:
        type: number
      gain_realized_percent:
        type: number
      gain_unrealized_amount:
        type: number
      gain_unrealized_percent:
        type: number
      id:
        type: string
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  PaginatedAccounts:
    properties:
      data:
        items:
          $ref: '#/definitions/Account'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedHoldings:
    properties:
      data:
        items:
          $ref: '#/definitions/Holding'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedTaxLots:
    properties:
      data:
        items:
          $ref: '#/definitions/TaxLot'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedTransactions:
    properties:
      data:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedUploadTransactions:
    properties:
      data:
        items:
          $ref: '#/definitions/UploadTransaction'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedUploads:
    properties:
      data:
        items:
          $ref: '#/definitions/Upload'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  TaxLot:
    properties:
      account_id:
        type: string
      asset_description:
        type: string
      asset_type:
        type: string
      created_at:
        type: string
      holding_id:
        description: |-
          HoldingID is nil until a matching Holding exists to link to - imported
          transactions and holdings come from separate Fidelity exports and may
          not arrive in the same order.
        type: string
      id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
      remaining_quantity:
        type: number
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  TaxLotWithTransaction:
    properties:
      tax_lot:
        $ref: '#/definitions/TaxLot'
      transaction:
        $ref: '#/definitions/Transaction'
    type: object
  Transaction:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      fees:
        type: number
      holding_id:
        description: |-
          HoldingID is nil until a matching Holding exists to link to - imported
          transactions and holdings come from separate Fidelity exports and may
          not arrive in the same order.
        type: string
      id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  UpdateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
    type: object
  UpdateTaxLotRequest:
    properties:
      account_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
    required:
    - purchase_date
    - purchase_price
    - purchase_quantity
    type: object
  UpdateTransactionRequest:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      commission:
        type: number
      date:
        type: string
      fees:
        type: number
      price:
        type: number
      quantity:
        type: number
    required:
    - action
    - date
    type: object
  Upload:
    properties:
      account_id:
        type: string
      created_at:
        type: string
      end_date:
        type: string
      file_name:
        type: string
      id:
        type: string
      start_date:
        description: |-
          StartDate and EndDate bound the dates of the transactions in the file, so
          we know the range covered. Nil until the file is parsed.
        type: string
      updated_at:
        type: string
    type: object
  UploadResult:
    properties:
      created:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  UploadTransaction:
    properties:
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      fees:
        type: number
      id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      transaction_id:
        description: |-
          TransactionID links this to its Transaction. A transaction has 0 or 1
          upload_transaction (enforced by the unique index), and the holding and
          account can be reached through the transaction.
        type: string
      updated_at:
        type: string
      upload_id:
        description: UploadID ties this row to the file import it came from.
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Portfolio tracking API
  title: My Portfolio API
  version: "1.0"
paths:
  /accounts:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedAccounts'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List accounts with pagination
      tags:
      - accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Account payload
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new account
      tags:
      - accounts
  /holdings:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedHoldings'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List holdings with pagination
      tags:
      - holdings
    post:
      consumes:
      - application/json
      parameters:
      - description: Holding payload
        in: body
        name: holding
        required: true
        schema:
          $ref: '#/definitions/CreateHoldingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Holding'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new holding
      tags:
      - holdings
  /holdings/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Holding ID
        in: path
        name: id
        required: true
        type: string
      - description: Holding payload
        in: body
        name: holding
        required: true
        schema:
          $ref: '#/definitions/UpdateHoldingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Holding'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an existing holding
      tags:
      - holdings
  /tax-lots:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Filter to a single holding
        in: query
        name: holding_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedTaxLots'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List tax lots with pagination
      tags:
      - tax-lots
    post:
      consumes:
      - application/json
      description: Records a purchase lot against a holding and, in the same transaction,
        the buy transaction that produced it.
      parameters:
      - description: Tax lot payload
        in: body
        name: tax_lot
        required: true
        schema:
          $ref: '#/definitions/CreateTaxLotRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/TaxLotWithTransaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a tax lot
      tags:
      - tax-lots
  /tax-lots/{id}:
    patch:
      consumes:
      - application/json
      description: Updates the lot and recomputes the holding's position from its
        open lots. The originally recorded buy transaction is left as-is.
      parameters:
      - description: Tax lot ID
        in: path
        name: id
        required: true
        type: string
      - description: Tax lot payload
        in: body
        name: tax_lot
        required: true
        schema:
          $ref: '#/definitions/UpdateTaxLotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TaxLot'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a tax lot
      tags:
      - tax-lots
  /transactions:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Filter to a single holding
        in: query
        name: holding_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedTransactions'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List transactions with pagination
      tags:
      - transactions
    post:
      consumes:
      - application/json
      parameters:
      - description: Transaction payload
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a transaction
      tags:
      - transactions
  /transactions/{id}:
    delete:
      description: Soft-deletes the transaction; if it belongs to a holding, the holding's
        lots and aggregates are rebuilt from its remaining buys and sells. A buy's
        own lot is not removed.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a transaction
      tags:
      - transactions
    patch:
      consumes:
      - application/json
      description: Updates the transaction; if it belongs to a holding, the holding's
        lots and aggregates are rebuilt from its buys and sells. A buy's own lot is
        not changed.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      - description: Transaction payload
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/UpdateTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a transaction
      tags:
      - transactions
  /upload-transactions:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedUploadTransactions'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List upload transactions with pagination
      tags:
      - upload-transactions
  /uploads:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedUploads'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List uploads with pagination
      tags:
      - uploads
    post:
      consumes:
      - multipart/form-data
      description: 'Routes the file to a handler selected by file_type + account_type
        (currently: holdings + fidelity)'
      parameters:
      - description: File to import
        in: formData
        name: file
        required: true
        type: file
      - description: Kind of data in the file (e.g. holdings, transactions)
        in: formData
        name: file_type
        required: true
        type: string
      - description: Institution the file came from (e.g. fidelity)
        in: formData
        name: account_type
        required: true
        type: string
      - description: Account to tie the data to (required for transactions)
        in: formData
        name: account_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UploadResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload a data file for import
      tags:
      - uploads
  /users:
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a user
      tags:
      - users
swagger: "2.0"
