          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a trade from an opening transaction
      tags:
      - trades
  /trades/{id}:
    delete:
      description: Removes the journal entry, its fills and rule checks. The transactions
        are untouched; closes it held may be picked up by other open trades.
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a trade
      tags:
      - trades
    get:
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Trade'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a trade with its fills and rule checks
      tags:
      - trades
    patch:
      consumes:
      - application/json
      description: Replaces the plan. Moving the trade to a different strategy replaces
        its rule checklist with the new strategy's, unanswered.
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      - description: Trade payload
        in: body
        name: trade
        required: true
        schema:
          $ref: '#/definitions/UpdateTradeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Trade'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a trade's plan and journal fields
      tags:
      - trades
  /trades/{id}/candidates:
    get:
      description: Opening and closing transactions in the trade's account, on its
        underlying (the stock and its options), since it opened, with shares no trade
        holds yet.
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/TradeCandidate'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Transactions that could be added to a trade
      tags:
      - trades
  /trades/{id}/fills:
    post:
      consumes:
      - application/json
      description: Adds an entry (a scale-in, or another leg on the same underlying)
        or an exit. An exit given without a quantity is sized like an auto fill, to
        what the trade had open; with one it is pinned as a manual fill.
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      - description: Fill payload
        in: body
        name: fill
        required: true
        schema:
          $ref: '#/definitions/AddFillRequest'
      produces:
      - application/json
