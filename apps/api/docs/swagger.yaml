basePath: /
definitions:
  Account:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      cash_balance:
        description: |-
          CashBalance is the account's uninvested cash (core money market and
          pending activity), as the broker last reported it. Positions are derived
          from tax lots, but cash never forms a lot, so it can only come from an
          import. CashBalanceAsOf is the date the broker's figure describes; nil
          means no import has reported cash, and an account with neither cash nor
          lots keeps a hand-entered Balance (see portfolio.RecalcAccountBalance).
        type: number
      cash_balance_as_of:
        type: string
      created_at:
        type: string
      default_cost_basis:
        type: string
      id:
        type: string
      owners:
        items:
          $ref: '#/definitions/User'
        type: array
      tax_type:
        type: string
      transactions:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      updated_at:
        type: string
    type: object
  AddFillRequest:
    properties:
      quantity:
        description: |-
          Quantity in the transaction's own shares; omitted means all of it that
          no other trade holds.
        type: number
      transaction_id:
        type: string
    type: object
  AdminLog:
    properties:
      created_at:
        type: string
      duration_ms:
        description: |-
          DurationMS is how long the run took, stored so reading "took 4s" needs no
          arithmetic over the two timestamps.
        type: integer
      errors:
        description: |-
          Errors is what went wrong, one per line, or nil for a clean run.

          It is independent of the run having completed: a sweep can finish having
          failed on some of its items - a symbol the quote provider won't price -
          and that is a successful run with errors in it, not a failure.
        type: string
      finished_at:
        type: string
      id:
        type: string
      started_at:
        type: string
      utility:
        description: |-
          Utility names the tool that ran - see the Utility* constants in
          internal/adminlog. Indexed with StartedAt so "the latest run of each
          utility" is an index scan.
        type: string
    type: object
  AllocationSlice:
    properties:
      label:
        type: string
      percent:
        type: number
      value:
        type: number
    type: object
  AllocationSummary:
    properties:
      asset_classes:
        description: |-
          AssetClasses splits the whole portfolio; EquitySectors splits the equity
          part of it and is weighted within that, since a sector describes a company
          and means nothing for cash or a government bond.
        items:
          $ref: '#/definitions/AllocationSlice'
        type: array
      equity_percent:
        type: number
      equity_sectors:
        items:
          $ref: '#/definitions/AllocationSlice'
        type: array
      equity_value:
        type: number
      total_value:
        type: number
    type: object
  CapitalSummary:
    properties:
      long_term:
        type: number
      loss_carryforward:
        description: LossCarryforward is a net loss left over, as a positive number.
        type: number
      net:
        type: number
      offset:
        description: Offset is how much of one holding period's loss the other's gain
          absorbed.
        type: number
      short_term:
        type: number
      taxable:
        description: |-
          Taxable is what reaches taxable income: the net when it's a gain, zero
          when it's a loss.
        type: number
    type: object
  CreateAccountRequest:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      default_cost_basis:
        type: string
      owner_ids:
        items:
          type: string
        type: array
      tax_type:
        type: string
    required:
    - account_name
    - account_type
    type: object
  CreateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      issuer_jurisdiction:
        type: string
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
      tax_class_override:
        description: |-
          TaxClassOverride and IssuerJurisdiction describe the asset's tax
          attributes; nil means "derive from the asset type". They replace the old
          state_tax_exempt flag - what a holding pays and who issued it are facts
          about the asset, while whether that's exempt is a jurisdiction's rule.
        type: string
    required:
    - asset_type
    - description
    type: object
  CreateSplitRequest:
    properties:
      effective_date:
        type: string
      holding_id:
        type: string
      new_shares:
        type: number
      old_shares:
        type: number
    required:
    - effective_date
    - new_shares
    - old_shares
    type: object
  CreateTaxLotRequest:
    properties:
      account_id:
        type: string
      commission:
        type: number
      fees:
        type: number
      holding_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
    required:
    - purchase_date
    - purchase_price
    - purchase_quantity
    type: object
  CreateTradeRequest:
    properties:
      initial_stop:
        type: number
      met_rule_ids:
        description: |-
          MetRuleIDs are the strategy's entry and risk rules the setup met.
          Omitted leaves the checklist unanswered.
        items:
          type: string
        type: array
      notes:
        type: string
      planned_risk:
        description: PlannedRisk overrides the risk derived from the stop.
        type: number
      quantity:
        description: |-
          Quantity of it that belongs to the trade, in its own shares. Omitted
          means all of it that no other trade holds.
        type: number
      strategy_id:
        type: string
      target:
        type: number
      transaction_id:
        description: |-
          TransactionID is the opening trade the journal entry starts from - a buy,
          or a sell-to-open for a written option.
        type: string
    type: object
  CreateTransactionRequest:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      date:
        type: string
      fees:
        type: number
      holding_id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
    required:
    - action
    - date
    type: object
  CreateUserRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    required:
    - first_name
    - last_name
    type: object
  Distribution:
    properties:
      account_id:
        type: string
      amount:
        type: number
      asset_type:
        type: string
      category:
        description: |-
          Category is the kind of income: "dividend" (from a security) or
          "interest" (from a cash/savings balance).
        type: string
      created_at:
        type: string
      holding_id:
        description: |-
          HoldingID, Symbol, and AssetType identify the paying security. Symbol and
          AssetType are unset for account-level income like bank interest, and
          HoldingID is nil until a matching holding exists to link to.
        type: string
      id:
        type: string
      payment_date:
        type: string
      symbol:
        type: string
      transaction_id:
        description: |-
          TransactionID is nil for a cash dividend or interest payment. It's reserved
          for a reinvested dividend, which also opens a buy lot - not handled yet.
        type: string
      updated_at:
        type: string
    type: object
  DistributionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: number
      asset_type:
        type: string
      category:
        type: string
      holding_id:
        type: string
      payment_date:
        type: string
      symbol:
        type: string
    required:
    - account_id
    - payment_date
    type: object
  DistributionSummary:
    properties:
      total:
        type: number
    type: object
  Holding:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      company_name:
        description: |-
          Reference data about the security, from a market-data provider. Purely
          descriptive - nothing in the portfolio or tax math reads it - so it is
          filled in when it can be and left empty when it can't.
        type: string
      contract_multiplier:
        description: |-
          ContractMultiplier is how many shares one unit of this holding covers -
          100 for a standard option contract, 1 for everything else. Quoted prices
          are per share, so every basis and proceeds figure scales by it.
        type: number
      cost_basis_total:
        type: number
      country:
        type: string
      created_at:
        type: string
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      exchange:
        type: string
      expiration_date:
        type: string
      gain_realized_amount:
        type: number
      gain_realized_percent:
        type: number
      gain_unrealized_amount:
        type: number
      gain_unrealized_percent:
        type: number
      id:
        type: string
      industry:
        type: string
      issuer_jurisdiction:
        description: |-
          IssuerJurisdiction is the government that issued this asset's debt, for
          the bond classes. It's what the tax rules compare against a jurisdiction
          to decide questions like "did my own state issue this?" - nil means the
          asset-type default (see defaultIssuerJurisdiction).
        type: string
      last_price:
        type: number
      last_price_updated_at:
        description: |-
          LastPriceUpdatedAt is what the price is as of - the moment the exchange
          last traded at it, or when we fetched it if the provider didn't say. Nil
          for a price that came in with an imported positions file, which carries
          no time of its own beyond the file's own date.
        type: string
      logo_url:
        type: string
      option_type:
        description: '"call" | "put"'
        type: string
      profile_fetched_at:
        description: |-
          ProfileFetchedAt records that a lookup happened, whether or not it found
          anything. Without it a symbol the provider doesn't cover - a treasury
          CUSIP, an option contract - would be retried on every pass forever.
        type: string
      purchase_quantity:
        type: number
      sector:
        type: string
      status:
        type: string
      strike_price:
        type: number
      symbol:
        type: string
      tax_class:
        description: |-
          TaxClass is the resolved class (override, else the asset-type default),
          computed for responses via AfterFind and never persisted.
        type: string
      tax_class_override:
        description: |-
          TaxClassOverride overrides the tax class implied by the asset type. Nil
          means "derive from the asset type" (see ResolveTaxClass); a non-nil value
          is an explicit user choice - e.g. a treasury-only ETF like TLT classed as
          government_bond even though ETFs are equity by default.
        type: string
      underlying:
        description: |-
          Option detail, decoded from the contract symbol (see ParseOptionSymbol).
          Nil/empty for everything else.
        type: string
      updated_at:
        type: string
      website:
        type: string
    type: object
  JurisdictionSummary:
    properties:
      capital:
        allOf:
        - $ref: '#/definitions/CapitalSummary'
        description: |-
          Capital and Ordinary are reported apart because they are taxed apart: a
          capital loss nets against capital gains only, never against interest or
          dividends.
      code:
        type: string
      excluded:
        items:
          $ref: '#/definitions/TaxExclusion'
        type: array
      level:
        type: string
      name:
        type: string
      ordinary:
        items:
          $ref: '#/definitions/TaxBucket'
        type: array
      ordinary_total:
        type: number
      taxable_total:
        type: number
    type: object
  PaginatedAccounts:
    properties:
      data:
        items:
          $ref: '#/definitions/Account'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedDistributions:
    properties:
      data:
        items:
          $ref: '#/definitions/Distribution'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      summary:
        $ref: '#/definitions/DistributionSummary'
      total:
        type: integer
    type: object
  PaginatedHoldings:
    properties:
      data:
        items:
          $ref: '#/definitions/Holding'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedRealizedEvents:
    properties:
      data:
        items:
          $ref: '#/definitions/RealizedEvent'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      summary:
        $ref: '#/definitions/RealizedEventSummary'
      total:
        type: integer
    type: object
  PaginatedTaxLots:
    properties:
      data:
        items:
          $ref: '#/definitions/TaxLot'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedTransactions:
    properties:
      data:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedUploadTransactions:
    properties:
      data:
        items:
          $ref: '#/definitions/UploadTransaction'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedUploads:
    properties:
      data:
        items:
          $ref: '#/definitions/UploadRecord'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PriceRefreshResult:
    properties:
      considered:
        type: integer
      failed:
        type: integer
      fetched_at:
        description: |-
          FetchedAt is when the pass ran, which is not what any one price is as of -
          each holding carries its own last_price_updated_at.
        type: string
      not_found:
        type: integer
      priced:
        type: integer
      provider:
        description: |-
          Provider names the vendor that answered. Worth reporting now that it's
          swappable: free tiers differ in coverage, so which one priced the book
          explains a symbol that came back unpriced.
        type: string
      symbols:
        items:
          $ref: '#/definitions/marketdata.QuotedSymbol'
        type: array
    type: object
  RealizedEvent:
    properties:
      account_id:
        type: string
      acquired_date:
        description: |-
          Lot detail, set only for a disposal. Nil on income, which has no lot
          behind it - distinct from a cost basis that happens to be zero. Quantity
          is in the shares as they were on EventDate, as a 1099-B reports them, not
          split-adjusted to today.
        type: string
      amount:
        type: number
      asset_type:
        type: string
      category:
        description: |-
          Category is what was realized: IncomeTypeCapitalGain, IncomeTypeInterest,
          or IncomeTypeDividend. Origin is which kind of source produced it.
        type: string
      cost_basis:
        type: number
      created_at:
        type: string
      distribution_id:
        type: string
      event_date:
        description: |-
          EventDate is when it was realized - the sell's date, or the payment date.
          One column for both so the ledger sorts and filters by time as a whole.
        type: string
      holding_id:
        type: string
      id:
        type: string
      origin:
        type: string
      proceeds:
        type: number
      quantity:
        type: number
      symbol:
        type: string
      tax_lot_id:
        type: string
      term:
        description: '"short" | "long"; empty for income'
        type: string
      transaction_id:
        description: |-
          Source links. Two real foreign keys rather than a polymorphic pair, so
          each stays a genuine reference the database can enforce. TransactionID is
          the realizing trade and TaxLotID the TaxLot it drew from (whose own
          TransactionID is the opening trade); DistributionID is the income record.
          Exactly one origin's ids are set.
        type: string
      treatments:
        description: |-
          Treatments is how each jurisdiction taxes this event. A real association
          now that the ledger is one table, so it preloads like any other.
        items:
          $ref: '#/definitions/TaxTreatment'
        type: array
      updated_at:
        type: string
    type: object
  RealizedEventSummary:
    properties:
      capital_gains:
        type: number
      dividends:
        type: number
      interest:
        type: number
      total:
        type: number
    type: object
  RecalculateResult:
    properties:
      closed:
        type: integer
      holdings:
        type: integer
      open:
        type: integer
    type: object
  RuleCheckInput:
    properties:
      id:
        type: string
      met:
        type: boolean
    type: object
  StockSplit:
    properties:
      created_at:
        type: string
      effective_date:
        description: |-
          EffectiveDate is the first day the shares trade split-adjusted (the
          ex-date). A trade on this date is already in post-split shares.
        type: string
      holding_id:
        type: string
      id:
        type: string
      new_shares:
        type: number
      old_shares:
        type: number
      updated_at:
        type: string
    type: object
  Strategy:
    properties:
      created_at:
        type: string
      description:
        type: string
      direction:
        description: |-
          Direction is DirectionLong, DirectionShort, or "both". Timeframe is free
          text ("swing", "daily", "weeks") - descriptive only.
        type: string
      id:
        type: string
      name:
        type: string
      rules:
        items:
          $ref: '#/definitions/StrategyRule'
        type: array
      status:
        type: string
      timeframe:
        type: string
      updated_at:
        type: string
    type: object
  StrategyPerformance:
    properties:
      strategies:
        items:
          $ref: '#/definitions/TradeStats'
        type: array
      total:
        $ref: '#/definitions/TradeStats'
    type: object
  StrategyRequest:
    properties:
      description:
        type: string
      direction:
        type: string
      name:
        type: string
      rules:
        items:
          $ref: '#/definitions/StrategyRuleInput'
        type: array
      status:
        type: string
      timeframe:
        type: string
    required:
    - name
    type: object
  StrategyRule:
    properties:
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      sort_order:
        type: integer
      strategy_id:
        type: string
      text:
        type: string
      updated_at:
        type: string
    type: object
  StrategyRuleInput:
    properties:
      kind:
        type: string
      text:
        type: string
    required:
    - kind
    - text
    type: object
  TaxBucket:
    properties:
      amount:
        type: number
      character:
        type: string
      label:
        type: string
    type: object
  TaxExclusion:
    properties:
      amount:
        type: number
      label:
        type: string
      reason:
        type: string
    type: object
  TaxJurisdiction:
    properties:
      code:
        type: string
      created_at:
        type: string
      currency_code:
        type: string
      level:
        description: national | regional
        type: string
      name:
        type: string
      parent_code:
        description: |-
          ParentCode is the jurisdiction this one sits inside, nil for a national
          jurisdiction.
        type: string
      updated_at:
        type: string
    type: object
  TaxLot:
    properties:
      account_id:
        type: string
      adjusted_price:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      contract_multiplier:
        type: number
      cost_basis:
        description: |-
          CostBasis is the open part of the lot at its opening price, commission
          and fees included - negative for a short lot, where the premium came in.
        type: number
      created_at:
        type: string
      direction:
        description: |-
          Direction is "long" or "short"; a written option's lot took premium in
          rather than paying it out, so its figures carry the opposite sign.
        type: string
      gain_unrealized_amount:
        type: number
      gain_unrealized_percent:
        type: number
      holding_id:
        type: string
      id:
        type: string
      last_price:
        type: number
      market_value:
        description: |-
          MarketValue and the unrealized figures are nil when the holding has no
          price: an unpriced lot has an unknown value, not a value of zero, and
          reporting zero would show the whole basis as a loss.
        type: number
      opening_transaction_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
      quantity:
        type: number
      realized_gains:
        description: RealizedGains is what has been realized from the closed part
          of the lot.
        type: number
      remaining_quantity:
        type: number
      split_factor:
        type: number
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  TaxLotWithTransaction:
    properties:
      tax_lot:
        $ref: '#/definitions/TaxLot'
      transaction:
        $ref: '#/definitions/Transaction'
    type: object
  TaxProfile:
    properties:
      country_code:
        description: |-
          CountryCode is the national jurisdiction's code; RegionCode the regional
          one, nil where the country has no regional income tax or the person isn't
          subject to one.
        type: string
      created_at:
        type: string
      effective_from:
        description: |-
          EffectiveFrom is when this residency started. Only the current profile is
          consulted today; storing the date means a residency history can be added
          later without a migration.
        type: string
      id:
        type: string
      region_code:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  TaxProfileRequest:
    properties:
      country_code:
        type: string
      effective_from:
        description: |-
          EffectiveFrom is when this residency started, as a plain date
          (YYYY-MM-DD). The client sends its own calendar date because only it
          knows what "today" means where the user is: at 9pm in California it is
          already tomorrow in UTC, so a server-side "today" would record a date the
          user hasn't reached. Omitted, it falls back to the UTC date.
        type: string
      region_code:
        type: string
      user_id:
        type: string
    required:
    - country_code
    - user_id
    type: object
  TaxRule:
    properties:
      asset_tax_class:
        type: string
      character:
        description: |-
          Stored as tax_character: "character" is a type name in Postgres and can't
          be used unquoted as a column.
        type: string
      created_at:
        type: string
      id:
        type: string
      income_type:
        description: Match columns. Empty string = matches anything.
        type: string
      issuer_scope:
        description: see IssuerScope* above
        type: string
      jurisdiction_code:
        type: string
      note:
        type: string
      priority:
        description: |-
          Priority orders the match; highest wins. Reason is the machine-readable
          label carried onto the resulting treatment so the UI can explain an
          exclusion ("Excluded - U.S. Treasury interest").
        type: integer
      reason:
        type: string
      term:
        description: short | long, capital gains only
        type: string
      treatment:
        description: Outcome.
        type: string
      updated_at:
        type: string
    type: object
  TaxSummary:
    properties:
      jurisdictions:
        items:
          $ref: '#/definitions/JurisdictionSummary'
        type: array
      year:
        type: integer
    type: object
  TaxTreatment:
    properties:
      character:
        description: |-
          Stored as tax_character: "character" is a type name in Postgres and can't
          be used unquoted as a column.
        type: string
      created_at:
        type: string
      excluded_amount:
        type: number
      id:
        type: string
      jurisdiction_code:
        type: string
      realized_event_id:
        description: |-
          RealizedEventID is a real foreign key: one ledger means this can be a
          plain association rather than a polymorphic (type, id) pair, so treatments
          preload with their events instead of being stitched together by hand.
        type: string
      reason:
        type: string
      rule_id:
        description: |-
          RuleID is the rule that decided this, nil when no rule was consulted (a
          sheltered account) or none matched. Reason is its machine-readable label.
        type: string
      tax_year:
        description: |-
          TaxYear is denormalized from the event so a year's per-jurisdiction
          summary stays a single grouped query with no join. It's rewritten with the
          treatment, so it can't drift from the event it came from.
        type: integer
      taxable:
        type: boolean
      taxable_amount:
        description: |-
          TaxableAmount and ExcludedAmount split the event's amount by this
          jurisdiction's treatment; exactly one is non-zero. Keeping the excluded
          side rather than dropping it is what lets the UI show what was left out
          ("Excluded - U.S. Treasury interest") instead of a silently smaller total.
        type: number
      updated_at:
        type: string
    type: object
  Trade:
    properties:
      account_id:
        description: |-
          A trade lives in one account. Underlying is the stock the legs are on -
          the symbol itself for a stock, the option's underlying for a contract -
          so a covered call's shares and calls belong to one trade.
        type: string
      avg_entry_price:
        type: number
      avg_exit_price:
        type: number
      closed_on:
        type: string
      created_at:
        type: string
      current_stop:
        type: number
      direction:
        description: |-
          Direction is the side of the first leg: long for a buy, short for a
          written option.
        type: string
      entry_value:
        type: number
      fees:
        type: number
      fills:
        items:
          $ref: '#/definitions/TradeFill'
        type: array
      gross_pnl:
        type: number
      holding_days:
        type: integer
      id:
        type: string
      initial_stop:
        description: |-
          The plan. Prices are per share, as quoted. InitialStop is where the stop
          was when the trade was taken and isn't meant to move - R is measured
          against it - while CurrentStop tracks a trailing stop.

          PlannedRisk is the dollars at stake if the initial stop is hit. It's
          derived from the stop for a single-leg trade, but stored because a
          multi-leg position has no single stop price to derive it from.
        type: number
      net_pnl:
        type: number
      notes:
        type: string
      open_quantity:
        description: |-
          Cached figures, recomputed from the fills on every sync. Realized only:
          what's still open is valued at read time against the holding's price
          (UnrealizedPnL), since a reprice doesn't run the sync.

          OpenQuantity and the average prices are the first leg's, in today's
          shares, so they line up with the holding's current price. EntryValue is
          the price-only value of every entry, the capital the trade put to work.
          GrossPnL is price-only; NetPnL takes off commission and fees.
        type: number
      opened_on:
        type: string
      planned_risk:
        type: number
      r_multiple:
        description: |-
          RMultiple is NetPnL over PlannedRisk, set once the trade is closed - a
          partial result in R would read as a final one.
        type: number
      rating:
        description: 1-5, the user's grade of how the trade was executed
        type: integer
      return_percent:
        type: number
      rule_checks:
        items:
          $ref: '#/definitions/TradeRuleCheck'
        type: array
      status:
        description: |-
          Status, OpenedOn and ClosedOn are derived from the fills on every sync:
          opened at the first entry, closed on the exit that left every leg flat.
        type: string
      strategy:
        $ref: '#/definitions/Strategy'
      strategy_id:
        type: string
      structure:
        type: string
      target:
        type: number
      underlying:
        type: string
      unrealized_pnl:
        type: number
      updated_at:
        type: string
    type: object
  TradeCandidate:
    properties:
      available_quantity:
        type: number
      detached:
        description: |-
          Detached is set when it was auto-attached to this trade once and the
          user took it off.
        type: boolean
      transaction:
        $ref: '#/definitions/Transaction'
    type: object
  TradeFill:
    properties:
      created_at:
        type: string
      detached:
        type: boolean
      exit_reason:
        type: string
      id:
        type: string
      quantity:
        type: number
      source:
        type: string
      trade_id:
        type: string
      transaction:
        $ref: '#/definitions/Transaction'
      transaction_id:
        type: string
      updated_at:
        type: string
    type: object
  TradeRuleCheck:
    properties:
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      met:
        type: boolean
      sort_order:
        type: integer
      text:
        type: string
      trade_id:
        type: string
      updated_at:
        type: string
    type: object
  TradeStats:
    properties:
      avg_holding_days:
        type: number
      avg_loss:
        description: negative
        type: number
      avg_r:
        description: |-
          AvgR is averaged over the trades that had a planned risk (RTrades of
          them), since a trade without a stop has no R.
        type: number
      avg_win:
        type: number
      expectancy:
        type: number
      largest_loss:
        type: number
      largest_win:
        type: number
      losses:
        type: integer
      max_drawdown:
        description: |-
          MaxDrawdown is the largest peak-to-trough fall of cumulative net P&L,
          taking trades in the order they closed. Positive, in dollars.
        type: number
      net_pnl:
        type: number
      profit_factor:
        description: |-
          ProfitFactor is gross winnings over gross losses; Expectancy is the
          average net result per trade.
        type: number
      r_trades:
        type: integer
      rule_adherence:
        description: |-
          RuleAdherence is the percent of answered rule checks that were met,
          across these trades. Nil when none were answered.
        type: number
      strategy_id:
        type: string
      strategy_name:
        type: string
      trades:
        type: integer
      win_rate:
        description: percent
        type: number
      wins:
        type: integer
    type: object
  Transaction:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      direction:
        type: string
      effect:
        description: |-
          Effect and Direction describe what a trade does to the lot ledger, which
          the action alone can't say once options are involved: writing an option
          OPENS a position by selling, and buying it back CLOSES one.

          Effect is "open" (opens a TaxLot) or "close" (depletes lots); Direction is
          "long" or "short", saying which side the lot sits on. A stock buy is an
          open/long and a stock sell a close/long, so the existing behaviour is just
          the ordinary case of the same rule. Empty on non-lot actions.
        type: string
      fees:
        type: number
      holding_id:
        description: |-
          HoldingID is nil until a matching Holding exists to link to - imported
          transactions and holdings come from separate Fidelity exports and may
          not arrive in the same order.
        type: string
      id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  UpdateFillRequest:
    properties:
      exit_reason:
        type: string
      quantity:
        description: |-
          Quantity, when set, pins the fill at that size; an auto fill becomes a
          manual one, so the sync stops resizing it.
        type: number
    type: object
  UpdateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      issuer_jurisdiction:
        type: string
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
      tax_class_override:
        type: string
    type: object
  UpdateTaxLotRequest:
    properties:
      account_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
    required:
    - purchase_date
    - purchase_price
    - purchase_quantity
    type: object
  UpdateTradeRequest:
    properties:
      current_stop:
        type: number
      initial_stop:
        type: number
      notes:
        type: string
      planned_risk:
        description: |-
          PlannedRisk overrides the risk derived from the initial stop; leave it
          out to derive it.
        type: number
      rating:
        type: integer
      strategy_id:
        type: string
      structure:
        type: string
      target:
        type: number
    type: object
  UpdateTransactionRequest:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      commission:
        type: number
      date:
        type: string
      fees:
        type: number
      price:
        type: number
      quantity:
        type: number
    required:
    - action
    - date
    type: object
  UploadRecord:
    properties:
      account_id:
        type: string
      account_name:
        type: string
      created_at:
        type: string
      end_date:
        type: string
      file_name:
        description: |-
          FileName is the bare name of the file, with any directory part stripped:
          history reads better as "Positions.csv" than as the path a client
          happened to send.
        type: string
      file_type:
        description: |-
          FileType is the kind of data the file carried - holdings or transactions -
          which is what distinguishes two imports of the same account on the same
          day from each other. Empty on rows imported before it was recorded.
        type: string
      id:
        type: string
      start_date:
        description: |-
          StartDate and EndDate bound the dates of the transactions in the file, so
          we know the range covered. Both are nil for a positions snapshot, which
          describes one moment rather than a span.
        type: string
      updated_at:
        type: string
    type: object
  UploadResult:
    properties:
      created:
        type: integer
      duplicates:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  UploadTransaction:
    properties:
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      distribution_id:
        type: string
      fees:
        type: number
      id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      transaction_id:
        description: |-
          A row links to exactly one of the domain records the import produced: a
          Transaction (trades) or a Distribution (dividends/interest). Both are
          nullable so either kind can be absent; a transaction still has 0 or 1
          upload_transaction (the unique index treats NULLs as distinct, so many
          distribution rows can share a NULL transaction_id).
        type: string
      updated_at:
        type: string
      upload_id:
        description: UploadID ties this row to the file import it came from.
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
    type: object
  marketdata.BackfillResult:
    properties:
      considered:
        type: integer
      enriched:
        type: integer
      errors:
        description: |-
          Errors is one message per holding whose lookup failed, so a caller can
          record why rather than only how many.
        items:
          type: string
        type: array
      failed:
        type: integer
      not_found:
        type: integer
    type: object
  marketdata.QuotedSymbol:
    properties:
      as_of:
        type: string
      error:
        description: |-
          Error is why a failed lookup failed, empty otherwise. Worth carrying: a
          bare "failed" says nothing about whether to retry, widen a plan, or swap
          providers, and a 402 says all three.
        type: string
      outcome:
        description: Outcome is "priced", "not_found", or "failed".
        type: string
      previous_price:
        description: |-
          Previous is the price this replaced, so an obviously wrong quote is
          visible as a jump rather than having to be inferred.
        type: number
      price:
        description: Price and AsOf are set only for a symbol that was priced.
        type: number
      symbol:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Portfolio tracking API
  title: My Portfolio API
  version: "1.0"
paths:
  /accounts:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedAccounts'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List accounts with pagination
      tags:
      - accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Account payload
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new account
      tags:
      - accounts
  /admin/logs/latest:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/AdminLog'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: The most recent run of each maintenance utility
      tags:
      - admin
  /distributions:
    get:
      parameters:
      - description: Filter to the tax year the income was paid
        in: query
        name: year
        type: integer
      - description: Filter to a single holding
        in: query
        name: holding_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedDistributions'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List income distributions (dividends/interest) with pagination and
        a year summary
      tags:
      - distributions
    post:
      consumes:
      - application/json
      parameters:
      - description: Distribution payload
        in: body
        name: distribution
        required: true
        schema:
          $ref: '#/definitions/DistributionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Distribution'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record an income payment by hand
      tags:
      - distributions
  /distributions/{id}:
    delete:
      parameters:
      - description: Distribution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an income payment
      tags:
      - distributions
    patch:
      consumes:
      - application/json
      parameters:
      - description: Distribution ID
        in: path
        name: id
        required: true
        type: string
      - description: Distribution payload
        in: body
        name: distribution
        required: true
        schema:
          $ref: '#/definitions/DistributionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Distribution'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an income payment
      tags:
      - distributions
  /holdings:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Sort field (market_value)
        enum:
        - market_value
        in: query
        name: sort
        type: string
      - description: Sort direction (default desc)
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Status filter (default Open)
        enum:
        - Open
        - Closed
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedHoldings'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List holdings with pagination
      tags:
      - holdings
    post:
      consumes:
      - application/json
      parameters:
      - description: Holding payload
        in: body
        name: holding
        required: true
        schema:
          $ref: '#/definitions/CreateHoldingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Holding'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new holding
      tags:
      - holdings
  /holdings/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Holding ID
        in: path
        name: id
        required: true
        type: string
      - description: Holding payload
        in: body
        name: holding
        required: true
        schema:
          $ref: '#/definitions/UpdateHoldingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Holding'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an existing holding
      tags:
      - holdings
  /holdings/allocation:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AllocationSummary'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Portfolio allocation by asset type, and sector within equities
      tags:
      - holdings
  /holdings/backfill-profiles:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/marketdata.BackfillResult'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Look up reference data for holdings that don't have it yet
      tags:
      - holdings
  /holdings/recalculate:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RecalculateResult'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rebuild every holding's tax lots, realized events and aggregates from
        its ledger
      tags:
      - holdings
  /holdings/refresh-prices:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PriceRefreshResult'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Re-quote every open stock holding's last price
      tags:
      - holdings
  /splits:
    get:
      parameters:
      - description: Holding ID
        in: query
        name: holding_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/StockSplit'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List a holding's stock splits, oldest first
      tags:
      - splits
    post:
      consumes:
      - application/json
      description: Every old_shares held before effective_date become new_shares (2-for-1
        is 1 -> 2; a 1-for-8 reverse split is 8 -> 1). The holding's lots are rebuilt
        around it; its transactions are left as traded.
      parameters:
      - description: Split payload
        in: body
        name: split
        required: true
        schema:
          $ref: '#/definitions/CreateSplitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/StockSplit'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record a stock split
      tags:
      - splits
  /splits/{id}:
    delete:
      description: Rebuilds the holding's lots without it. Rejected if post-split
        sells would no longer be covered.
      parameters:
      - description: Split ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a stock split
      tags:
      - splits
  /strategies:
    get:
      parameters:
      - description: active or retired; omit for both
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Strategy'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List strategies with their rules
      tags:
      - strategies
    post:
      consumes:
      - application/json
      parameters:
      - description: Strategy payload
        in: body
        name: strategy
        required: true
        schema:
          $ref: '#/definitions/StrategyRequest'
      produces:
      - application/json
