basePath: /
definitions:
  Account:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      created_at:
        type: string
      default_cost_basis:
        type: string
      id:
        type: string
      owners:
        items:
          $ref: '#/definitions/User'
        type: array
      tax_type:
        type: string
      transactions:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      updated_at:
        type: string
    type: object
  CreateAccountRequest:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      default_cost_basis:
        type: string
      owner_ids:
        items:
          type: string
        type: array
      tax_type:
        type: string
    required:
    - account_name
    - account_type
    type: object
  CreateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
    required:
    - asset_type
    - description
    type: object
  Holding:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      created_at:
        type: string
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      gain_realized_amount:
        type: number
      gain_realized_percent:
        type: number
      gain_unrealized_amount:
        type: number
      gain_unrealized_percent:
        type: number
      id:
        type: string
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
      tax_lots:
        items:
          $ref: '#/definitions/TaxLot'
        type: array
      updated_at:
        type: string
    type: object
  PaginatedAccounts:
    properties:
      data:
        items:
          $ref: '#/definitions/Account'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedHoldings:
    properties:
      data:
        items:
          $ref: '#/definitions/Holding'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  TaxLot:
    properties:
      account_id:
        type: string
      asset_description:
        type: string
      asset_type:
        type: string
      created_at:
        type: string
      holding_id:
        description: |-
          HoldingID is nil until a matching Holding exists to link to - imported
          transactions and holdings come from separate Fidelity exports and may
          not arrive in the same order.
        type: string
      id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
      remaining_quantity:
        type: number
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  Transaction:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      fees:
        type: number
      id:
        type: integer
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  UploadResult:
    properties:
      created:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  User:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Portfolio tracking API
  title: My Portfolio API
  version: "1.0"
paths:
  /accounts:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedAccounts'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List accounts with pagination
      tags:
      - accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Account payload
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new account
      tags:
      - accounts
  /holdings:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedHoldings'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List holdings with pagination
      tags:
      - holdings
    post:
      consumes:
      - application/json
      parameters:
      - description: Holding payload
        in: body
        name: holding
        required: true
        schema:
          $ref: '#/definitions/CreateHoldingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Holding'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new holding
      tags:
      - holdings
  /uploads:
    post:
      consumes:
      - multipart/form-data
      description: 'Routes the file to a handler selected by file_type + account_type
        (currently: holdings + fidelity)'
      parameters:
      - description: File to import
        in: formData
        name: file
        required: true
        type: file
      - description: Kind of data in the file (e.g. holdings, transactions)
        in: formData
        name: file_type
        required: true
        type: string
      - description: Institution the file came from (e.g. fidelity)
        in: formData
        name: account_type
        required: true
        type: string
      - description: Account to tie the data to (required for transactions)
        in: formData
        name: account_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UploadResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload a data file for import
      tags:
      - uploads
swagger: "2.0"
