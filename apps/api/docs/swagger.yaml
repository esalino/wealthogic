        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List trades, newest first
      tags:
      - trades
    post:
      consumes:
      - application/json
      description: Creates the trade with the transaction as its first entry, snapshots
        the strategy's rules onto it, and attaches any later closes that exit it.
      parameters:
      - description: Trade payload
        in: body
        name: trade
        required: true
