basePath: /
definitions:
  Account:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      created_at:
        type: string
      default_cost_basis:
        type: string
      id:
        type: string
      owners:
        items:
          $ref: '#/definitions/User'
        type: array
      tax_type:
        type: string
      transactions:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      updated_at:
        type: string
    type: object
  CreateAccountRequest:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      balance:
        type: number
      default_cost_basis:
        type: string
      owner_ids:
        items:
          type: string
        type: array
      tax_type:
        type: string
    required:
    - account_name
    - account_type
    type: object
  CreateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      issuer_jurisdiction:
        type: string
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
      tax_class_override:
        description: |-
          TaxClassOverride and IssuerJurisdiction describe the asset's tax
          attributes; nil means "derive from the asset type". They replace the old
          state_tax_exempt flag - what a holding pays and who issued it are facts
          about the asset, while whether that's exempt is a jurisdiction's rule.
        type: string
    required:
    - asset_type
    - description
    type: object
  CreateTaxLotRequest:
    properties:
      account_id:
        type: string
      commission:
        type: number
      fees:
        type: number
      holding_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
    required:
    - purchase_date
    - purchase_price
    - purchase_quantity
    type: object
  CreateTransactionRequest:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      date:
        type: string
      fees:
        type: number
      holding_id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
    required:
    - action
    - date
    type: object
  CreateUserRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    required:
    - first_name
    - last_name
    type: object
  Distribution:
    properties:
      account_id:
        type: string
      amount:
        type: number
      asset_type:
        type: string
      category:
        description: |-
          Category is the kind of income: "dividend" (from a security) or
          "interest" (from a cash/savings balance).
        type: string
      created_at:
        type: string
      holding_id:
        description: |-
          HoldingID, Symbol, and AssetType identify the paying security. Symbol and
          AssetType are unset for account-level income like bank interest, and
          HoldingID is nil until a matching holding exists to link to.
        type: string
      id:
        type: string
      payment_date:
        type: string
      symbol:
        type: string
      transaction_id:
        description: |-
          TransactionID is nil for a cash dividend or interest payment. It's reserved
          for a reinvested dividend, which also opens a buy lot - not handled yet.
        type: string
      updated_at:
        type: string
    type: object
  DistributionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: number
      asset_type:
        type: string
      category:
        type: string
      holding_id:
        type: string
      payment_date:
        type: string
      symbol:
        type: string
    required:
    - account_id
    - payment_date
    type: object
  DistributionSummary:
    properties:
      total:
        type: number
    type: object
  Holding:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      contract_multiplier:
        description: |-
          ContractMultiplier is how many shares one unit of this holding covers -
          100 for a standard option contract, 1 for everything else. Quoted prices
          are per share, so every basis and proceeds figure scales by it.
        type: number
      cost_basis_total:
        type: number
      created_at:
        type: string
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      expiration_date:
        type: string
      gain_realized_amount:
        type: number
      gain_realized_percent:
        type: number
      gain_unrealized_amount:
        type: number
      gain_unrealized_percent:
        type: number
      id:
        type: string
      issuer_jurisdiction:
        description: |-
          IssuerJurisdiction is the government that issued this asset's debt, for
          the bond classes. It's what the tax rules compare against a jurisdiction
          to decide questions like "did my own state issue this?" - nil means the
          asset-type default (see defaultIssuerJurisdiction).
        type: string
      last_price:
        type: number
      option_type:
        description: '"call" | "put"'
        type: string
      purchase_quantity:
        type: number
      status:
        type: string
      strike_price:
        type: number
      symbol:
        type: string
      tax_class:
        description: |-
          TaxClass is the resolved class (override, else the asset-type default),
          computed for responses via AfterFind and never persisted.
        type: string
      tax_class_override:
        description: |-
          TaxClassOverride overrides the tax class implied by the asset type. Nil
          means "derive from the asset type" (see ResolveTaxClass); a non-nil value
          is an explicit user choice - e.g. a treasury-only ETF like TLT classed as
          government_bond even though ETFs are equity by default.
        type: string
      underlying:
        description: |-
          Option detail, decoded from the contract symbol (see ParseOptionSymbol).
          Nil/empty for everything else.
        type: string
      updated_at:
        type: string
    type: object
  JurisdictionSummary:
    properties:
      buckets:
        items:
          $ref: '#/definitions/TaxBucket'
        type: array
      code:
        type: string
      excluded:
        items:
          $ref: '#/definitions/TaxExclusion'
        type: array
      level:
        type: string
      name:
        type: string
      taxable_total:
        type: number
    type: object
  PaginatedAccounts:
    properties:
      data:
        items:
          $ref: '#/definitions/Account'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedDistributions:
    properties:
      data:
        items:
          $ref: '#/definitions/Distribution'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      summary:
        $ref: '#/definitions/DistributionSummary'
      total:
        type: integer
    type: object
  PaginatedHoldings:
    properties:
      data:
        items:
          $ref: '#/definitions/Holding'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedRealizedEvents:
    properties:
      data:
        items:
          $ref: '#/definitions/RealizedEvent'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      summary:
        $ref: '#/definitions/RealizedEventSummary'
      total:
        type: integer
    type: object
  PaginatedTaxLots:
    properties:
      data:
        items:
          $ref: '#/definitions/TaxLot'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedTransactions:
    properties:
      data:
        items:
          $ref: '#/definitions/Transaction'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedUploadTransactions:
    properties:
      data:
        items:
          $ref: '#/definitions/UploadTransaction'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  PaginatedUploads:
    properties:
      data:
        items:
          $ref: '#/definitions/Upload'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  RealizedEvent:
    properties:
      account_id:
        type: string
      acquired_date:
        description: |-
          Lot detail, set only for a disposal. Nil on income, which has no lot
          behind it - distinct from a cost basis that happens to be zero.
        type: string
      amount:
        type: number
      asset_type:
        type: string
      category:
        description: |-
          Category is what was realized: IncomeTypeCapitalGain, IncomeTypeInterest,
          or IncomeTypeDividend. Origin is which kind of source produced it.
        type: string
      cost_basis:
        type: number
      created_at:
        type: string
      distribution_id:
        type: string
      event_date:
        description: |-
          EventDate is when it was realized - the sell's date, or the payment date.
          One column for both so the ledger sorts and filters by time as a whole.
        type: string
      holding_id:
        type: string
      id:
        type: string
      lot_transaction_id:
        type: string
      origin:
        type: string
      proceeds:
        type: number
      quantity:
        type: number
      symbol:
        type: string
      term:
        description: '"short" | "long"; empty for income'
        type: string
      transaction_id:
        description: |-
          Source links. Two real foreign keys rather than a polymorphic pair, so
          each stays a genuine reference the database can enforce. TransactionID is
          the realizing sell and LotTransactionID the buy that supplied the shares;
          DistributionID is the income record. Exactly one origin's ids are set.
        type: string
      treatments:
        description: |-
          Treatments is how each jurisdiction taxes this event. A real association
          now that the ledger is one table, so it preloads like any other.
        items:
          $ref: '#/definitions/TaxTreatment'
        type: array
      updated_at:
        type: string
    type: object
  RealizedEventSummary:
    properties:
      capital_gains:
        type: number
      dividends:
        type: number
      interest:
        type: number
      total:
        type: number
    type: object
  TaxBucket:
    properties:
      amount:
        type: number
      character:
        type: string
      label:
        type: string
    type: object
  TaxExclusion:
    properties:
      amount:
        type: number
      label:
        type: string
      reason:
        type: string
    type: object
  TaxJurisdiction:
    properties:
      code:
        type: string
      created_at:
        type: string
      currency_code:
        type: string
      level:
        description: national | regional
        type: string
      name:
        type: string
      parent_code:
        description: |-
          ParentCode is the jurisdiction this one sits inside, nil for a national
          jurisdiction.
        type: string
      updated_at:
        type: string
    type: object
  TaxLot:
    properties:
      account_id:
        type: string
      asset_description:
        type: string
      asset_type:
        type: string
      created_at:
        type: string
      holding_id:
        type: string
      id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
      remaining_quantity:
        type: number
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  TaxLotWithTransaction:
    properties:
      tax_lot:
        $ref: '#/definitions/TaxLot'
      transaction:
        $ref: '#/definitions/Transaction'
    type: object
  TaxProfile:
    properties:
      country_code:
        description: |-
          CountryCode is the national jurisdiction's code; RegionCode the regional
          one, nil where the country has no regional income tax or the person isn't
          subject to one.
        type: string
      created_at:
        type: string
      effective_from:
        description: |-
          EffectiveFrom is when this residency started. Only the current profile is
          consulted today; storing the date means a residency history can be added
          later without a migration.
        type: string
      id:
        type: string
      region_code:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  TaxProfileRequest:
    properties:
      country_code:
        type: string
      region_code:
        type: string
      user_id:
        type: string
    required:
    - country_code
    - user_id
    type: object
  TaxRule:
    properties:
      asset_tax_class:
        type: string
      character:
        description: |-
          Stored as tax_character: "character" is a type name in Postgres and can't
          be used unquoted as a column.
        type: string
      created_at:
        type: string
      id:
        type: string
      income_type:
        description: Match columns. Empty string = matches anything.
        type: string
      issuer_scope:
        description: see IssuerScope* above
        type: string
      jurisdiction_code:
        type: string
      note:
        type: string
      priority:
        description: |-
          Priority orders the match; highest wins. Reason is the machine-readable
          label carried onto the resulting treatment so the UI can explain an
          exclusion ("Excluded - U.S. Treasury interest").
        type: integer
      reason:
        type: string
      term:
        description: short | long, capital gains only
        type: string
      treatment:
        description: Outcome.
        type: string
      updated_at:
        type: string
    type: object
  TaxSummary:
    properties:
      jurisdictions:
        items:
          $ref: '#/definitions/JurisdictionSummary'
        type: array
      year:
        type: integer
    type: object
  TaxTreatment:
    properties:
      character:
        description: |-
          Stored as tax_character: "character" is a type name in Postgres and can't
          be used unquoted as a column.
        type: string
      created_at:
        type: string
      excluded_amount:
        type: number
      id:
        type: string
      jurisdiction_code:
        type: string
      realized_event_id:
        description: |-
          RealizedEventID is a real foreign key: one ledger means this can be a
          plain association rather than a polymorphic (type, id) pair, so treatments
          preload with their events instead of being stitched together by hand.
        type: string
      reason:
        type: string
      rule_id:
        description: |-
          RuleID is the rule that decided this, nil when no rule was consulted (a
          sheltered account) or none matched. Reason is its machine-readable label.
        type: string
      tax_year:
        description: |-
          TaxYear is denormalized from the event so a year's per-jurisdiction
          summary stays a single grouped query with no join. It's rewritten with the
          treatment, so it can't drift from the event it came from.
        type: integer
      taxable:
        type: boolean
      taxable_amount:
        description: |-
          TaxableAmount and ExcludedAmount split the event's amount by this
          jurisdiction's treatment; exactly one is non-zero. Keeping the excluded
          side rather than dropping it is what lets the UI show what was left out
          ("Excluded - U.S. Treasury interest") instead of a silently smaller total.
        type: number
      updated_at:
        type: string
    type: object
  Transaction:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      direction:
        type: string
      effect:
        description: |-
          Effect and Direction describe what a trade does to the lot ledger, which
          the action alone can't say once options are involved: writing an option
          OPENS a position by selling, and buying it back CLOSES one.

          Effect is "open" (creates a lot) or "close" (depletes lots); Direction is
          "long" or "short", saying which side the lot sits on. A stock buy is an
          open/long and a stock sell a close/long, so the existing behaviour is just
          the ordinary case of the same rule. Empty on non-lot actions.
        type: string
      fees:
        type: number
      holding_id:
        description: |-
          HoldingID is nil until a matching Holding exists to link to - imported
          transactions and holdings come from separate Fidelity exports and may
          not arrive in the same order.
        type: string
      id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      remaining_quantity:
        description: |-
          RemainingQuantity is set only on a stock buy, which doubles as a tax lot:
          it's the shares of this purchase still open (quantity minus what later
          sells have disposed). Nil for sells and other actions. Maintained as a
          cache by the recompute; the Gain ledger is the source of truth.
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      updated_at:
        type: string
    type: object
  UpdateHoldingRequest:
    properties:
      asset_type:
        type: string
      average_cost_basis:
        type: number
      cost_basis_total:
        type: number
      current_value:
        type: number
      description:
        type: string
      dividend_income:
        type: number
      issuer_jurisdiction:
        type: string
      last_price:
        type: number
      purchase_quantity:
        type: number
      status:
        type: string
      symbol:
        type: string
      tax_class_override:
        type: string
    type: object
  UpdateTaxLotRequest:
    properties:
      account_id:
        type: string
      purchase_date:
        type: string
      purchase_price:
        type: number
      purchase_quantity:
        type: number
    required:
    - purchase_date
    - purchase_price
    - purchase_quantity
    type: object
  UpdateTransactionRequest:
    properties:
      account_id:
        type: string
      action:
        type: string
      amount:
        type: number
      commission:
        type: number
      date:
        type: string
      fees:
        type: number
      price:
        type: number
      quantity:
        type: number
    required:
    - action
    - date
    type: object
  Upload:
    properties:
      account_id:
        type: string
      created_at:
        type: string
      end_date:
        type: string
      file_name:
        type: string
      id:
        type: string
      start_date:
        description: |-
          StartDate and EndDate bound the dates of the transactions in the file, so
          we know the range covered. Nil until the file is parsed.
        type: string
      updated_at:
        type: string
    type: object
  UploadResult:
    properties:
      created:
        type: integer
      duplicates:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  UploadTransaction:
    properties:
      action:
        type: string
      amount:
        type: number
      asset_description:
        type: string
      asset_type:
        type: string
      commission:
        type: number
      created_at:
        type: string
      date:
        type: string
      distribution_id:
        type: string
      fees:
        type: number
      id:
        type: string
      price:
        type: number
      quantity:
        type: number
      realized_gains:
        type: number
      settlement_date:
        type: string
      symbol:
        type: string
      transaction_id:
        description: |-
          A row links to exactly one of the domain records the import produced: a
          Transaction (trades) or a Distribution (dividends/interest). Both are
          nullable so either kind can be absent; a transaction still has 0 or 1
          upload_transaction (the unique index treats NULLs as distinct, so many
          distribution rows can share a NULL transaction_id).
        type: string
      updated_at:
        type: string
      upload_id:
        description: UploadID ties this row to the file import it came from.
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Portfolio tracking API
  title: My Portfolio API
  version: "1.0"
paths:
  /accounts:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedAccounts'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List accounts with pagination
      tags:
      - accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Account payload
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new account
      tags:
      - accounts
  /distributions:
    get:
      parameters:
      - description: Filter to the tax year the income was paid
        in: query
        name: year
        type: integer
      - description: Filter to a single holding
        in: query
        name: holding_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedDistributions'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List income distributions (dividends/interest) with pagination and
        a year summary
      tags:
      - distributions
    post:
      consumes:
      - application/json
      parameters:
      - description: Distribution payload
        in: body
        name: distribution
        required: true
        schema:
          $ref: '#/definitions/DistributionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Distribution'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record an income payment by hand
      tags:
      - distributions
  /distributions/{id}:
    delete:
      parameters:
      - description: Distribution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an income payment
      tags:
      - distributions
    patch:
      consumes:
      - application/json
      parameters:
      - description: Distribution ID
        in: path
        name: id
        required: true
        type: string
      - description: Distribution payload
        in: body
        name: distribution
        required: true
        schema:
          $ref: '#/definitions/DistributionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Distribution'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
