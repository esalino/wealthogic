            $ref: '#/definitions/Trade'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Attach a transaction to a trade
      tags:
      - trades
  /trades/{id}/fills/{fill_id}:
    delete:
      description: A manual fill is removed. An auto fill is detached instead, so
        the sync doesn't attach it again; adding it back re-attaches it.
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      - description: Fill ID
        in: path
        name: fill_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Trade'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Take a fill off a trade
      tags:
      - trades
    patch:
      consumes:
      - application/json
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      - description: Fill ID
        in: path
        name: fill_id
        required: true
        type: string
      - description: Fill payload
        in: body
        name: fill
        required: true
        schema:
          $ref: '#/definitions/UpdateFillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Trade'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record an exit reason or resize a fill
      tags:
      - trades
  /trades/{id}/rule-checks:
    put:
      consumes:
      - application/json
      description: Sets met (true, false, or null for unanswered) on each check listed;
        checks not listed are left alone.
      parameters:
      - description: Trade ID
        in: path
        name: id
        required: true
        type: string
      - description: Checks
        in: body
        name: checks
        required: true
        schema:
          items:
            $ref: '#/definitions/RuleCheckInput'
