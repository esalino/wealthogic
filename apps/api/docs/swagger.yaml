      consumes:
      - multipart/form-data
      description: 'Routes the file to a handler selected by file_type + account_type
        (currently: holdings + fidelity)'
      parameters:
      - description: File to import
        in: formData
        name: file
        required: true
        type: file
      - description: Kind of data in the file (e.g. holdings, transactions)
        in: formData
        name: file_type
        required: true
        type: string
      - description: Institution the file came from (e.g. fidelity)
        in: formData
        name: account_type
        required: true
        type: string
      - description: Account to tie the data to (required for transactions)
        in: formData
        name: account_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UploadResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload a data file for import
      tags:
      - uploads
  /users:
    post:
